[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-inversion-defense-proxy"
version = "0.1.0"
description = "Differential privacy noise injection and gradient mask gateway protecting user data against token inference attacks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
model-inversion-defense-proxy = "model_inversion_defense_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model_inversion_defense_proxy*"]
